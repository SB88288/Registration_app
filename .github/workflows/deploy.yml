
name: Registration App CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test Application
        run: npm test

      - name: Create Deployment Package
        run: |
          tar czf registration-app.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=registration_app_uploads \
            .

      - name: Copy Application to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "registration-app.tar.gz"
          target: "/tmp"

      - name: Deploy Application on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /var/www/registration_app

            tar xzf /tmp/registration-app.tar.gz

            npm ci --omit=dev

            node --check app.js

            pm2 reload registration-app --update-env || \
              pm2 start app.js --name registration-app

            pm2 save

            curl -fsS http://127.0.0.1:3000/health

            rm -f /tmp/registration-app.tar.gz
