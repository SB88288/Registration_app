name: Deploy Registration App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from GitHub
        uses: actions/checkout@v4

      - name: Verify source files
        run: |
          ls -la
          test -f app.js
          test -f package.json

      - name: Copy app files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.js,package.json,package-lock.json,public,views"
          target: "/tmp/registration_app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /var/www/registration_app
            sudo cp -r /tmp/registration_app/. /var/www/registration_app/
            cd /var/www/registration_app
            npm ci --omit=dev
            if pm2 describe registration-app >/dev/null 2>&1; then
              pm2 reload registration-app
            else
              pm2 start app.js --name registration-app
            fi
            pm2 save
